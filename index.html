<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בית ספר אור | פיד למידה</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.app{max-width:920px;margin:auto;padding:18px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:22px;font-weight:900}.avatar{width:42px;height:42px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 18px #14213d12}.hero{background:linear-gradient(135deg,#173b78,#2869d8);color:#fff;border-radius:28px;padding:28px;box-shadow:0 14px 35px #1d4ed833}.hero small{opacity:.82}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,46px)}.hero p{max-width:700px;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#174a9b}.ghost{background:#ffffff22;color:#fff;border:1px solid #ffffff55}.feed-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 12px}.feed-head h2{margin:0;font-size:24px}.feed-head p{margin:4px 0 0;color:#6f7a8f}.chips{display:flex;gap:8px;overflow:auto;padding:6px 0 10px;position:sticky;top:0;background:#f5f7fbe8;backdrop-filter:blur(10px);z-index:4}.chip{white-space:nowrap;border:0;background:#fff;color:#48566c;padding:10px 13px;border-radius:999px;font-weight:800;box-shadow:0 3px 14px #14213d0b;cursor:pointer}.chip.active{background:#245fc0;color:#fff}.feed{display:grid;gap:14px}.feed-card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 6px 24px #14213d0b;border:1px solid #edf1f7}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.source{display:inline-flex;align-items:center;gap:7px;font-weight:900;color:#245fc0;cursor:pointer}.kind{font-size:12px;background:#f2f5fa;color:#667085;padding:7px 10px;border-radius:999px;font-weight:800}.feed-card h3{margin:0 0 8px;font-size:21px;line-height:1.35}.feed-card p{margin:0;color:#3c485d;line-height:1.65}.detail{margin-top:12px;background:#f7f9fc;border-radius:14px;padding:11px 12px;color:#64748b;font-size:13px;line-height:1.5}.question{margin-top:12px;background:#edf4ff;border-radius:14px;padding:12px;color:#24508e;font-weight:700;line-height:1.5}.open-source{margin-top:14px;border:0;background:#edf4ff;color:#245fc0;padding:10px 13px;border-radius:12px;font-weight:800;cursor:pointer}.loader{text-align:center;padding:24px;color:#748197;font-weight:800}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid #e8ecf3;display:flex;justify-content:center;z-index:8}.navin{width:min(680px,100%);display:flex;justify-content:space-around;padding:10px 6px}.navitem{text-decoration:none;text-align:center;font-size:12px;color:#667085;min-width:58px}.navitem strong{display:block;font-size:21px;margin-bottom:3px}.active{color:#205fc1}@media(max-width:680px){.app{padding:12px 11px 95px}.hero{padding:22px}.feed-head{display:block}.feed-head p{margin-top:6px}.feed-card{padding:18px}.feed-card h3{font-size:19px}}</style></head><body><main class="app"><header><div class="brand">☀️ בית ספר אור</div><div class="avatar">👤</div></header><section class="hero"><small>הפיד המרכזי שלך</small><h1>בוקר טוב, בן 👋</h1><p>כל מה שנבנה באתר מתנקז לכאן: שיעורים, מחקרים, שאלות, סיפורים, כלי תזונה וחשיבה ביקורתית. כל כרטיס מסמן מאיזה עמוד הוא הגיע ומאפשר להעמיק במקור.</p><div class="actions"><button class="btn primary" onclick="location.href='lessons.html'">📖 לכל השיעורים</button><button class="btn ghost" onclick="document.getElementById('centralFeed').scrollIntoView({behavior:'smooth'})">המשך לפיד</button></div></section><section class="feed-head"><div><h2>הפיד שלך</h2><p>תוכן מעורב מכל עמודי הלמידה באתר.</p></div></section><div class="chips"><button class="chip active" data-filter="all">הכול</button><button class="chip" data-filter="sleep">🌙 שינה</button><button class="chip" data-filter="critical">🧠 חשיבה</button><button class="chip" data-filter="nutrition">🥗 תזונה</button></div><section id="centralFeed" class="feed"></section><div id="feedLoader" class="loader">טוען עוד תוכן…</div></main><nav><div class="navin"><a class="navitem active" href="index.html"><strong>⌂</strong>בית</a><a class="navitem" href="lessons.html"><strong>📖</strong>שיעורים</a><a class="navitem" href="critical-thinking.html"><strong>🧠</strong>חשיבה</a><a class="navitem" href="nutrition-builder.html"><strong>🥗</strong>תזונה</a><a class="navitem" href="games.html"><strong>🎮</strong>משחקים</a></div></nav><script src="central-feed-data.js"></script><script>const feed=document.getElementById('centralFeed'),loader=document.getElementById('feedLoader');let filter='all',cursor=0,order=[];function shuffle(){const arr=window.centralFeedItems.map((_,i)=>i);for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}order=arr}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function current(){return order.map(i=>window.centralFeedItems[i]).filter(x=>filter==='all'||x.source===filter)}function card(x){return `<article class="feed-card"><div class="meta"><span class="source" onclick="location.href='${esc(x.href)}'">${esc(x.icon)} ${esc(x.sourceName)}</span><span class="kind">${esc(x.type)}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p>${x.detail?`<div class="detail">${esc(x.detail)}</div>`:''}${x.question?`<div class="question">${esc(x.question)}</div>`:''}<button class="open-source" onclick="location.href='${esc(x.href)}'">פתח את המקור ←</button></article>`}function loadMore(){const arr=current();if(!arr.length)return;for(let n=0;n<8;n++){const x=arr[(cursor+n)%arr.length];feed.insertAdjacentHTML('beforeend',card(x))}cursor+=8;if(cursor%arr.length<8)shuffle()}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;feed.innerHTML='';cursor=0;shuffle();loadMore()});shuffle();loadMore();new IntersectionObserver(es=>{if(es[0].isIntersecting)loadMore()},{rootMargin:'500px'}).observe(loader);</script></body></html>
