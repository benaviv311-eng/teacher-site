<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אתר המורה</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#182033}.wrap{max-width:900px;margin:auto;padding:24px}.hero{background:#fff;border-radius:24px;padding:32px;box-shadow:0 8px 30px #0001}.badge{display:inline-block;background:#e8f1ff;padding:8px 12px;border-radius:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:20px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 20px #0001}.btn{display:inline-block;margin-top:18px;background:#2563eb;color:#fff;border:0;border-radius:14px;padding:13px 20px;font-weight:bold}</style></head><body><main class="wrap"><section class="hero"><span class="badge">אתר המורה</span><h1>למידה חכמה, שיעור אחד בכל פעם</h1><p>מקצועות, נושאים, שיעורים, תרגול, משחקים ומעקב התקדמות במקום אחד.</p><button class="btn">כניסה למערכת</button></section><section class="cards"><div class="card"><h3>📚 מקצועות</h3><p>ניהול מקצועות ונושאי לימוד.</p></div><div class="card"><h3>📝 שיעורים</h3><p>יצירה ופרסום של חומרי למידה.</p></div><div class="card"><h3>👥 כיתות</h3><p>תלמידים והתקדמות.</p></div><div class="card"><h3>🎮 משחקים</h3><p>תרגול אינטראקטיבי מתוך השיעורים.</p></div></section></main></body></html>
