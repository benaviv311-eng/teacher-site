const slides=[{"type":"cover","title":"🍯 אוכל עם אפקט","sub":"מה באמת הוכח?","body":"<div class='hero'><b>שיעור 7 · מדעי התזונה · כיתה ח׳</b><p>15 סבבי משחק · 4 תשובות · אחרי כל שאלה שקופית תשובה עם הסבר · הקראה בעברית.</p></div>"},{"type":"info","title":"מטרת השיעור","sub":"לא כל “בריא” הוא “מרפא”","body":"<div class='terms'><span>מרפא</span><span>מקל</span><span>מסייע / משפר</span><span>מפחית סיכון</span></div><div class='callout'>נלמד לדייק: מה המזון עושה, אצל מי, באיזו כמות, ועד כמה המחקר חזק.</div>"},{"type":"info","title":"פתיחה","sub":"איזה משפט הכי מדויק?","body":"<div class='grid2'><div>🍯 דבש מרפא שיעול</div><div>🫐 חמוציות מרפאות דלקת שתן</div><div>🥣 שיבולת שועל מסייעת בהורדת LDL</div><div>🫚 ג׳ינג׳ר יכול לעזור בבחילות מסוימות</div></div><div class='teacher'>בחרו טענה אחת והסבירו למה אתם מאמינים לה.</div>"},{"type":"info","title":"איך יודעים מה מוכח?","sub":"ארבע רמות של ראיות","body":"<div class='grid4'><div class='ev green'><b>🟢 חזקות</b><br>הרבה מחקרים טובים ותוצאות עקביות.</div><div class='ev yellow'><b>🟡 בינוניות</b><br>יש תמיכה, אבל גם מגבלות.</div><div class='ev orange'><b>🟠 מוגבלות</b><br>יש סימנים, עדיין לא מספיק.</div><div class='ev red'><b>🔴 לא הוכח</b><br>טענה פופולרית ללא תמיכה מספקת.</div></div>"},{"type":"info","title":"איך המשחק עובד?","sub":"שאלה → בחירה → תשובה → הסבר","body":"<div class='steps'><div><b>1</b><br>קוראים</div><div><b>2</b><br>בוחרים A/B/C/D</div><div><b>3</b><br>עוברים לשקופית הבאה</div><div><b>4</b><br>בודקים גם את עוצמת הראיות</div></div>"},{"type":"question","title":"סבב 1 — 🥣 שיבולת שועל","sub":"מה היתרון שהכי מבוסס מחקרית?","tts":"שיבולת שועל. מה היתרון שהכי מבוסס מחקרית?. A. מעלה טסטוסטרון. B. מסייעת בהורדת LDL. C. מונעת שפעת. D. שורפת שומן","body":"<div class='options'><div><b>A</b>מעלה טסטוסטרון</div><div><b>B</b>מסייעת בהורדת LDL</div><div><b>C</b>מונעת שפעת</div><div><b>D</b>שורפת שומן</div></div><div class='teacher'>עצרו כאן. כל קבוצה בוחרת תשובה לפני שממשיכים.</div>"},{"type":"answer","title":"תשובה לסבב 1","sub":"🥣 שיבולת שועל","tts":"התשובה הנכונה היא B. מסייעת בהורדת LDL. בטא־גלוקן, סיב מסיס בשיבולת שועל, יכול לסייע בהפחתת LDL כחלק מתזונה מתאימה. שיבולת שועל יכולה לסייע בהפחתת LDL — לא “מנקה את העורקים”.","body":"<div class='answerbox'><h2>✅ B — מסייעת בהורדת LDL</h2><div class='evidence'>🟢 ראיות חזקות</div><p>בטא־גלוקן, סיב מסיס בשיבולת שועל, יכול לסייע בהפחתת LDL כחלק מתזונה מתאימה.</p></div><div class='precise'><b>הניסוח המדויק:</b> שיבולת שועל יכולה לסייע בהפחתת LDL — לא “מנקה את העורקים”.</div>"},{"type":"question","title":"סבב 2 — 🍯 דבש","sub":"מה הוא עשוי לעשות?","tts":"דבש. מה הוא עשוי לעשות?. A. להרוג וירוס של הצטננות. B. להקל על שיעול אצל ילדים מעל גיל שנה. C. לרפא דלקת ריאות. D. לחזק חיסון פי 2","body":"<div class='options'><div><b>A</b>להרוג וירוס של הצטננות</div><div><b>B</b>להקל על שיעול אצל ילדים מעל גיל שנה</div><div><b>C</b>לרפא דלקת ריאות</div><div><b>D</b>לחזק חיסון פי 2</div></div><div class='teacher'>עצרו כאן. כל קבוצה בוחרת תשובה לפני שממשיכים.</div>"},{"type":"answer","title":"תשובה לסבב 2","sub":"🍯 דבש","tts":"התשובה הנכונה היא B. להקל על שיעול. בחלק מהמחקרים דבש הקל על תדירות שיעול ועל השינה יותר מאי־טיפול או פלצבו. דבש יכול להקל על שיעול. לא נותנים דבש לתינוקות מתחת לגיל שנה.","body":"<div class='answerbox'><h2>✅ B — להקל על שיעול</h2><div class='evidence'>🟡 ראיות בינוניות</div><p>בחלק מהמחקרים דבש הקל על תדירות שיעול ועל השינה יותר מאי־טיפול או פלצבו.</p></div><div class='precise'><b>הניסוח המדויק:</b> דבש יכול להקל על שיעול. לא נותנים דבש לתינוקות מתחת לגיל שנה.</div>"},{"type":"question","title":"סבב 3 — 🫚 ג׳ינג׳ר","sub":"למה יש את התמיכה הטובה ביותר?","tts":"ג׳ינג׳ר. למה יש את התמיכה הטובה ביותר?. A. משפר ראייה. B. מרפא שפעת. C. עשוי לעזור בבחילות ובהקאות מסוימות. D. מונע כאבי שרירים לחלוטין","body":"<div class='options'><div><b>A</b>משפר ראייה</div><div><b>B</b>מרפא שפעת</div><div><b>C</b>עשוי לעזור בבחילות ובהקאות מסוימות</div><div><b>D</b>מונע כאבי שרירים לחלוטין</div></div><div class='teacher'>עצרו כאן. כל קבוצה בוחרת תשובה לפני שממשיכים.
