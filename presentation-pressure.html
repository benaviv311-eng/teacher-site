{k:'שיעור שביעי',t:'מעבדת הלחץ והביצועים',b:'מה קורה כשמשהו באמת חשוב לנו — ואיך נשארים יעילים גם תחת לחץ?',p:['לחץ','נשימה','דיבור עצמי','RESET','Choking','שליטה'],note:'פתיחה: לא להסביר מיד מהו לחץ. שאלו מתי הגוף “עולה הילוך” לפני ביצוע. לאורך השיעור עקבו אחרי גוף, קשב ומשמעות.',layout:'title'},
{k:'מטרת השיעור',t:'לא להעלים לחץ — ללמוד לתפקד בתוכו',cols:[['מה נבדוק?','מה הגוף עושה כשהביצוע חשוב','מתי לחץ עוזר ומתי מפריע','למה לפעמים “נחנקים”','איך חוזרים אחרי טעות'],['מה ניקח לחיים?','נשימה ככלי לוויסות','מילת ביצוע קצרה','RESET','מה בשליטתי','שגרת ביצוע']],foot:'ניסוי • מה קרה לי • למה זה חשוב • כלי לחיים',note:'לא להציג לחץ כטוב או רע. אותה עוררות יכולה להשפיע אחרת לפי האדם והמשימה.',layout:'cols'},
{n:'1',k:'לחץ אמיתי',t:'אותה משימה — מצב אחר',cols:[['סבב א׳','קליעת כדור נייר לפח','ניסיון רגיל'],['סבב ב׳','ספירה לאחור','ניקוד','כולם מסתכלים','ניסיון אחד']],foot:'טוויסט: קליעה לאחור = פרס כיתתי אמיתי שאפשר לקיים.',note:'אחרי הסבב שאלו מה יצר את הלחץ: קהל, חשיבות, זמן, ניסיון יחיד או פחד לאכזב.',layout:'cols'},
{n:'1',k:'מפצחים',t:'מה השתנה בגוף — למרות שהמשימה כמעט לא השתנתה?',cards:[['דופק','מהיר יותר?'],['נשימה','מהירה / שטוחה?'],['שרירים','מתח?'],['מחשבות','“אל תפשל”'],['קהל','כולם מסתכלים']],note:'אין צורך שכל תלמיד ירגיש הכול. הדגש: המשמעות של הרגע השתנתה.',layout:'cards'},
{n:'2',k:'לחץ תמיד רע?',t:'לפעמים קצת לחץ דווקא מחדד',cols:[['סבב א׳','העבירו כדור מיד ליד עשרים פעמים בקצב רגיל.'],['סבב ב׳','יש לכם חמש־עשרה שניות.','נסו לשבור את השיא.']],foot:'מה הלחץ הוסיף — אם בכלל?',note:'עוררות היא רמת הפעלה, לא מילה נרדפת לחרדה. התגובה אינה אחידה.',layout:'cols'},
{n:'2',k:'מסקנה',t:'לא כל לחץ הוא אויב',flow:['מעט מדי','אדישות','מתאים למשימה','חדות','יותר מדי','עומס'],foot:'השאלה: האם המצב שלי מתאים למה שאני צריך לבצע עכשיו?',note:'דיוק, כוח ומהירות עשויים לדרוש מצב שונה. אין רמת עוררות מושלמת אחת.',layout:'flow'},
{n:'3',k:'Choking',t:'למה אנחנו לפעמים מפריעים לעצמנו?',cols:[['עודף ניטור','אני עוקב במודע אחרי כל פרט במיומנות שכבר יחסית אוטומטית.'],['הסחת קשב','קהל, תוצאה, פחד מטעות ודאגות גוזלים קשב מהפעולה.']],foot:'יותר מחשבה ≠ בהכרח ביצוע טוב יותר',note:'Choking אינו כל טעות. הוא ירידה משמעותית ביחס ליכולת צפויה ברגע לחץ.',layout:'cols'},
{n:'3',k:'ניסוי שלישי',t:'כדרור רגיל מול “תחשוב על הכול”',cols:[['פעם ראשונה','“תכדרר רגיל.”'],['פעם שנייה','מרפק, אצבעות, ברך, קצב… ואל תטעה.']],foot:'כלי: רמז אחד — “מטרה”, “קצב”, “שחרור”, “הבא”.',note:'לא חייב להיות הבדל אצל כל תלמיד. שאלו על תחושת טבעיות וזרימה.',layout:'cols'},
{n:'4',k:'אחרי טעות',t:'הטעות שכבר נגמרה',cols:[['גרסה א׳','“אל תחטיא שוב.”','“זוכר מה עשית?”'],['גרסה ב׳','“הבא.”','“תכוון למרכז.”']],foot:'הטעות הראשונה כבר קרתה. האם היא תקבל גם את המהלך הבא?',note:'טעות יכולה להשאיר את הקשב בעבר. אפשר למדוד זמן התאוששות ולא רק מספר טעויות.',layout:'cols'},

{n:'6',k:'מיתוס או אמת?',t:'בוחרים צד, מנמקים ואז חושפים תשובה',cols:[['מיתוס','צד אחד של החדר'],['אמת','הצד השני']],foot:'שומרים על קצב: תשובה קצרה והסבר קצר.',note:'המטרה היא דיוק מדעי, לא הרצאה.',layout:'cols'},
{n:'6',k:'מיתוס או אמת?',t:'“לפני מצב מלחיץ צריך לקחת נשימה ענקית.”',layout:'myth',note:'בחרו צד.'},
{n:'6',k:'תשובה',t:'לא בהכרח',b:'נשימה אחת גדולה אינה בעיה, אבל נשימות גדולות ומהירות שוב ושוב עלולות להוביל לנשימת יתר. עדיף קצב רגוע ואיטי.',layout:'answer',note:'לא להפחיד תלמידים; הדגש הוא לא לנשום בכוח.'},
{n:'6',k:'מיתוס או אמת?',t:'“ככל שאכניס יותר חמצן — אבצע טוב יותר.”',layout:'myth',note:'בחרו צד.'},
{n:'6',k:'תשובה',t:'מיתוס',b:'יותר נשימות אינן נותנות “בוסט אינסופי”. היתרון האפשרי של האטת נשימה קשור בעיקר לוויסות הקצב הגופני.',layout:'answer',note:'לא צריך להיכנס לפיזיולוגיה עמוקה בכיתה.'},
{n:'6',k:'מיתוס או אמת?',t:'“אם אני מתנשף באימון — סימן שאני לא בכושר.”',layout:'myth',note:'בחרו צד.'},
{n:'6',k:'תשובה',t:'מיתוס',b:'גם ספורטאי בכושר גבוה מתנשף במאמץ עצים. כושר מתבטא גם ביכולת לבצע עומס ובהתאוששות.',layout:'answer',note:'חיבור לכדורסל: רצף ספרינטים יגרום גם לשחקן מאומן לנשום בכבדות.'},
{n:'6',k:'מיתוס או אמת?',t:'“אם אני לחוץ לפני משחק — סימן שאני לא מוכן.”',layout:'myth',note:'בחרו צד.'},
{n:'6',k:'תשובה',t:'מיתוס',b:'לחץ יכול להופיע דווקא כי האירוע חשוב. מוכנות אינה היעדר מוחלט של לחץ.',layout:'answer',note:'אפשר להיות מוכן מאוד ועדיין להרגיש פרפרים.'},
{n:'6',k:'מיתוס או אמת?',t:'“המטרה לפני ביצוע חשוב היא להיות רגוע ככל האפשר.”',layout:'myth',note:'בחרו צד.'},
{n:'6',k:'תשובה',t:'מיתוס',b:'לפני דיוק אולי נרצה פחות רעש; לפני ספרינט או מאבק על ריבאונד אולי נרצה יותר אנרגיה.',layout:'answer',note:'היעד הוא “מתאים למשימה”, לא “רגוע”.'},

{k:'מצב לחץ 1',t:'ביצוע מיידי',cols:[['בספורט','זריקת עונשין','הגשה','פנדל'],['בחיים','מבחן שמתחיל','הצגה מול הכיתה','שיחה שמתחילה עכשיו']],foot:'כלים: נשימה קצרה • רמז ביצוע • שגרה קבועה',note:'במצב מיידי אין זמן לניתוח ארוך. צריך כלי קצר שמחזיר לפעולה.',layout:'cols'},

{k:'מצבי לחץ 3–5',t:'טעות, קונפליקט וחוסר שליטה',cards:[['אחרי טעות','RESET • הפעולה הבאה'],['קונפליקט','עצירה • מטרה לשיחה • תגובה איטית'],['לא בשליטתי','לקבל את העובדה • להעביר קשב למה שכן בשליטתי']],note:'הדגש: כלי שונה לסוג לחץ שונה.',layout:'cards'},

function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(s,i){const el=document.createElement('section');el.className='slide'+(i===0?' active':'');let h=s.n?'<div class="section-num">שלב '+esc(s.n)+'</div>':'';h+='<div class="kicker">'+esc(s.k||'')+'</div>';if(s.layout==='title'){h+='<h1>'+esc(s.t)+'</h1><p>'+esc(s.b)+'</p><div class="pillrow">'+s.p.map(x=>'<span class="pill">'+esc(x)+'</span>').join('')+'</div>'}else if(s.layout==='cols'){h+='<h2>'+esc(s.t)+'</h2><div class="grid2">'+s.cols.map(c=>'<div class="card"><strong>'+esc(c[0])+'</strong>'+c.slice(1).map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>').join('')+'</div>'+(s.foot?'<p class="small">'+esc(s.foot)+'</p>':'')}else if(s.layout==='cards'){h+='<h2>'+esc(s.t)+'</h2><div class="grid3">'+s.cards.map(c=>'<div class="card"><strong>'+esc(c[0])+'</strong><p>'+esc(c[1])+'</p></div>').join('')+'</div>'+(s.foot?'<p class="small">'+esc(s.foot)+'</p>':'')}else if(s.layout==='flow'){h+='<h2>'+esc(s.t)+'</h2><div class="flow">'+s.flow.map((x,j)=>'<span class="node">'+esc(x)+'</span>'+(j<s.flow.length-1?'<span class="arrow">←</span>':'')).join('')+'</div>'+(s.foot?'<p class="small">'+esc(s.foot)+'</p>':'')}else if(s.layout==='myth'){h+='<div class="myth">'+esc(s.t)+'</div><div class="choice"><div>מיתוס</div><div>אמת</div><div>נמקו</div></div>'}else if(s.layout==='answer'){h+='<div class="answer">'+esc(s.t)+'</div><p class="big-quote">'+esc(s.b)+'</p>'}else if(s.layout==='breath'){h+='<h2>'+esc(s.t)+'</h2><div class="breathbox"><div class="breathword" id="breathWord">מוכן?</div><div class="breathtime" id="breathTime">60 שניות</div><div class="breathactions"><button id="breathGo">התחל</button><button id="breathStop">עצור</button></div></div>'}el.innerHTML=h;return el}
const holder=document.getElementById('slides');S.forEach((s,i)=>holder.appendChild(render(s,i)));let idx=0;const noteEl=document.getElementById('notes'),counter=document.getElementById('counter'),bar=document.getElementById('bar');let breathInt=null;
function stopBreath(){if(breathInt){clearInterval(breathInt);breathInt=null}const w=document.getElementById('breathWord'),t=document.getElementById('breathTime');if(w)w.textContent='מוכן?';if(t)t.textContent='60 שניות'}
function bindBreath(){const go=document.getElementById('breathGo'),st=document.getElementById('breathStop');if(!go)return;go.onclick=()=>{stopBreath();let left=60,phase=0;const w=document.getElementById('breathWord'),t=document.getElementById('breathTime');w.textContent='שאיפה';t.textContent='נותרו 60 שניות';breathInt=setInterval(()=>{left--;phase++;if(phase===5){w.textContent=w.textContent==='שאיפה'?'נשיפה':'שאיפה';phase=0}t.textContent='נותרו '+left+' שניות';if(left<=0){clearInterval(breathInt);breathInt=null;w.textContent='סיימנו';t.textContent='חזרו לנשימה טבעית'}},1000)};st.onclick=stopBreath}
function show(i){stopBreath();idx=Math.max(0,Math.min(S.length-1,i));document.querySelectorAll('.slide').forEach((x,j)=>x.classList.toggle('active',j===idx));counter.textContent=(idx+1)+' / '+S.length;bar.style.width=((idx+1)/S.length*100)+'%';noteEl.textContent=S[idx].note||'';noteEl.classList.remove('show');bindBreath()}
document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('notesBtn').onclick=()=>noteEl.classList.toggle('show');document.getElementById('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(idx+1)}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(idx-1)}else if(e.key.toLowerCase()==='f'){document.getElementById('fullBtn').click()}else if(e.key.toLowerCase()==='n'){document.getElementById('notesBtn').click()}else if(e.key==='Home'){show(0)}else if(e.key==='End'){show(S.length-1)}});show(0);
</script>
