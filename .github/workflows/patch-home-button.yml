name: Patch sleep lesson home button
on:
  push:
    paths:
      - '.github/workflows/patch-home-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fixed home icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lesson-sleep.html')
          s = p.read_text(encoding='utf-8')
          css_old = '.back::before{content:"↩";font-size:21px;font-weight:900}.hero'
          css_new = '.back::before{content:"↩";font-size:21px;font-weight:900}.home-fixed{position:fixed;top:12px;left:14px;width:38px;height:38px;border-radius:12px;background:#fff;color:#245fc0;display:grid;place-items:center;text-decoration:none;font-size:20px;box-shadow:0 4px 16px #14213d18;z-index:30}.hero'
          body_old = '<body><main class="wrap">'
          body_new = '<body><a class="home-fixed" href="index.html" aria-label="בית">🏠</a><main class="wrap">'
          if 'class="home-fixed"' not in s:
              if css_old not in s or body_old not in s:
                  raise SystemExit('Expected lesson markup not found')
              s = s.replace(css_old, css_new, 1).replace(body_old, body_new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lesson-sleep.html
          git commit -m 'Add fixed home icon to sleep lesson'
          git push
