name: Adjust sleep lesson UI
on:
  push:
    paths:
      - '.github/workflows/adjust-sleep-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update sleep lesson chrome
        shell: python
        run: |
          from pathlib import Path
          p = Path('lesson-sleep.html')
          s = p.read_text(encoding='utf-8')
          old_back = '.back{text-decoration:none;color:#245fc0;font-weight:800}'
          new_back = '.back{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:14px;background:#fff;color:#245fc0;display:grid;place-items:center;text-decoration:none;font-size:0;box-shadow:0 6px 22px #14213d22;z-index:20}.back::before{content:"🏠";font-size:22px}.top{padding-right:56px;min-height:44px}'
          old_stat = '.sticky-stat{position:fixed;left:12px;bottom:14px;background:#172033;color:#fff;border-radius:18px;padding:10px 13px;font-size:12px;box-shadow:0 8px 24px #0003;z-index:5}.sticky-stat b{font-size:16px}'
          new_stat = '.sticky-stat{display:none!important}'
          if old_back not in s:
              raise SystemExit('back-link CSS signature not found')
          if old_stat not in s:
              raise SystemExit('counter CSS signature not found')
          s = s.replace(old_back, new_back, 1).replace(old_stat, new_stat, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lesson-sleep.html
          git commit -m "Refine sleep lesson navigation" || exit 0
          git push
