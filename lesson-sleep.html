ותו רעיון מזוויות שונות. הפיד משלב חומר מהשיעור, מחקרים, ביסוסים, תרחישים ושאלות קצרות.</p></section><div class="chips"><button class="chip active" data-filter="all">הכול</button><button class="chip" data-filter="study">🔬 מחקרים</button><button class="chip" data-filter="question">❓ שאלות</button><button class="chip" data-filter="critical">🧠 חשיבה ביקורתית</button><button class="chip" data-filter="action">🌙 ליישום</button></div><section id="feed" class="feed"></section><div id="loader" class="loader">ממשיך להכין לך חומר…</div></main><div class="sticky-stat">נלמדו <b id="seen">0</b> כרטיסים</div><script>
const I=(type,concept,title,text,extra={})=>({type,concept,title,text,...extra});
const items=[
I('fact','sleep_quantity_quality','כמות שינה ואיכות שינה הן לא אותו דבר','כמות היא כמה זמן ישנת בפועל. איכות מתייחסת בין היתר לרציפות, לתזמון ולהרגשה שהשינה הייתה משקמת.'),
I('question','sleep_quantity_quality','9 שעות במיטה = 9 שעות שינה?','', {choices:['כן, תמיד','לא בהכרח'],correct:1,explain:'זמן במיטה אינו זהה בהכרח לזמן שינה בפועל.'}),
I('study','sleep_duration','כמה שעות שינה צריך בגיל ההתבגרות?','לפי המלצת AASM, בגיל 13–18 ההמלצה היא בדרך כלל 8–10 שעות שינה ביממה באופן קבוע.',{evidence:'הנחיה מקצועית',source:'Paruthi et al., 2016 • AASM • PMID 27250809',limit:'זו המלצה לטווח אוכלוסייה, לא מספר קסם שמתאים בדיוק לכל אדם בכל לילה.'}),
I('study','sleep_duration','ומה לגבי גיל 12?','לילדים בגיל 6–12 ההמלצה היא 9–12 שעות ביממה. לכן תלמיד בן 12 נמצא בטווח שונה מתלמיד בן 13.',{evidence:'הנחיה מקצועית',source:'AASM, 2016',limit:'גיל הוא רק חלק מהתמונה; גם איכות, תזמון וסדירות חשובים.'}),
I('fact','sleep_function','השינה היא לא “כיבוי”','בזמן שינה הגוף והמוח ממשיכים בתהליכים הקשורים ללמידה וזיכרון, ויסות רגשי, גדילה, בריאות והתאוששות.'),
I('question','sleep_function','מה המשפט המדויק יותר?','',{choices:['בשינה הגוף כבוי','בשינה הגוף עובד אחרת','שריר נבנה רק בזמן שינה'],correct:1,explain:'שינה היא מצב פעיל מבחינה ביולוגית. לא נכון לומר שהגוף פשוט “כבוי”, וגם לא ששריר נבנה רק בזמן השינה.'}),
I('fact','sport_recovery','אימון הוא רק חלק מהתהליך','האימון הוא גירוי. תזונה, שינה ומנוחה הן חלק מתהליך ההתאוששות וההסתגלות.'),
I('myth','sport_recovery','מיתוס: “אם התאמנתי טוב, השינה פחות חשובה”','אימון טוב לא מבטל חוסר שינה. במודל העובר ושב, פעולה טובה בתחום אחד לא פוטרת פעולה מזיקה בתחום אחר.'),
I('study','sleep_deprivation','מה קורה אחרי לילה שלם בלי שינה?','במחקר בקרב בני 14–18, לילה שלם ללא שינה פגע בקשב מתמשך, במהירות תגובה ובמהירות עיבוד, והעלה ישנוניות.',{evidence:'מחקר ניסויי',source:'Louca & Short, 2014 • Sleep • PMID 25364075',limit:'המחקר בדק לילה שלם ללא שינה. אסור להסיק ממנו ששעה אחת פחות גורמת בדיוק לאותו אפקט.'}),
I('critical','sleep_deprivation','מצא את ההגזמה','“מחקר הוכיח שכל תלמיד שישן שעה פחות יגיב לאט באותה מידה.”',{reveal:'זו הגזמה. המחקר בדק מניעת שינה מלאה, והתגובה לחוסר שינה משתנה לפי כמות החסר, מספר הלילות, האדם והמשימה.'}),
I('question','sleep_deprivation','לילה אחד גרוע ודפוס של שבוע — זה אותו דבר?','',{choices:['כן','לא'],correct:1,explain:'לילה בודד הוא אירוע; כשחוסר השינה חוזר שוב ושוב הוא עלול ליצור הצטברות של פגיעה בתפקוד.'}),
I('study','sleep_debt','7 לילות של שינה מוגבלת','במחקר בבני 15–19, 5 שעות זמן במיטה במשך 7 לילות הובילו לירידה מצטברת בקשב, בזיכרון עבודה, בתפקודים ניהוליים ובמצב רוח.',{evidence:'מחקר ניסויי',source:'Lo et al., 2016 • Sleep • PMID 26612392',limit:'5 שעות זמן במיטה הוא מצב משמעותי של הגבלת שינה; אין להסיק שכל חסר קטן ייצור אותה עוצמת פגיעה.'}),
I('study','recovery','שני לילות התאוששות לא תמיד מחזירים הכול מיד','באותו קו מחקרי, אחרי תקופה של שינה מוגבלת, חלק מהמדדים לא חזרו מיד לקו הבסיס אחרי שני לילות התאוששות.',{evidence:'מחקר ניסויי',source:'Lo et al., 2016',limit:'התאוששות כן יכולה לעזור. המסר הוא שלא כדאי להניח שסוף שבוע אחד “מוחק” אוטומטית כל חסר.'}),
I('study','recovery','ומה אומרים מחקרי המשך על מחזורי הגבלה והתאוששות?','מחקרי המשך בבני נוער מציעים שהצטברות חסר שינה יכולה להשפיע לאורך כמה מחזורים, וששינה משלימה עשויה לעזור אך לא תמיד לאפס מיד את כל המדדים.',{evidence:'מחקר ניסויי',source:'Lo et al., 2017 • Sleep • PMID 28364507',limit:'היקף ההשפעה תלוי בפרוטוקול המחקר, משך ההגבלה ומדד הביצוע.'}),
I('fact','sleep_pressure','לחץ שינה עולה ככל שאנחנו ערים','ככל שעובר יותר זמן של ערות, הצורך בשינה נוטה לעלות. אדנוזין הוא אחד החומרים המעורבים בתהליך הזה.'),
I('critical','sleep_pressure','החרוזים בקופסה הם המחשה — לא המוח','בשיעור אנחנו יכולים להוסיף חרוז לכל “יחידת ערות”, אבל במוח אין קופסה עם חרוזים.',{reveal:'הדגמה ≠ הוכחה. החרוזים עוזרים לחשוב על לחץ שינה, אך הם לא אדנוזין אמיתי ולא מדידה של “חוב שינה”.'}),
I('question','sleep_pressure','מה החרוזים מייצגים?','',{choices:['אדנוזין אמיתי שנאסף בקופסה','רעיון של לחץ שינה','מדידה מדויקת של חוב שינה'],correct:1,explain:'הם מודל מחשבתי שממחיש רעיון בלבד.'}),
I('fact','adenosine','אדנוזין והשינה','במהלך ערות רמות אדנוזין במוח נוטות לעלות, ובמהלך שינה הן נוטות לרדת. זהו חלק ממערכת מורכבת יותר של ויסות שינה וערות.'),
I('critical','evidence','“מודל” הוא לא “מדידה”','כשאנחנו משתמשים במטאפורה כמו חשבון בנק או קופסת חרוזים, היא יכולה לעזור להבין — אבל היא לא הופכת למדד רפואי אמיתי.'),
I('balance','balance_model','מודל העובר ושב','הגוף מקבל את המיקס של ההרגלים לאורך זמן.',{plus:['שינה מספקת','שעות יחסית קבועות','פעילות גופנית','תזונה טובה','התאוששות'],minus:['שינה קצרה חוזרת','מסכים שדוחים שינה','הפרעות רבות','עומס ללא התאוששות','שעות לא סדירות']}),
I('question','balance_model','אימון מעולה + 4 שעות שינה = הכול מתקזז?','',{choices:['כן','לא'],correct:1,explain:'פעולה טובה בתחום אחד לא מבטלת בהכרח פגיעה בתחום אחר. מודל העובר ושב הוא לא נוסחה מתמטית.'}),
I('scenario','balance_model','תרחיש: שבוע טוב, ארוחה אחת פחות טובה','אכלת טוב רוב השבוע והייתה ארוחה אחת פחות מאוזנת. האם “הרסת הכול”?',{reveal:'לא. הגוף מושפע מדפוסים לאורך זמן, לא מאירוע יחיד בלבד. אותו עיקרון עוזר לחשוב גם על שינה.'}),
I('fact','perception_reaction','לפני שהיד מגיבה, המוח צריך לעבוד','המסלול שאנחנו מתרגלים בשיעור: עין → תפיסה → עיבוד → החלטה → תגובה.',{flow:['עין','תפיסה','עיבוד','החלטה','תגובה']}),
I('scenario','perception_reaction','כדור מתקרב מהר — מה קורה קודם?','המוח צריך להעריך כיוון, מרחק, מהירות ותזמון לפני שהגוף מבצע את התגובה.',{reveal:'לכן ביצוע ספורטיבי תלוי לא רק בכוח או מהירות שרירית, אלא גם בקליטה, קשב, תפיסה, החלטה ותזמון.'}),
I('study','perception_reaction','שינה וזמן תגובה תפיסתי','מטא־אנליזה מ-2026 על מניעת שינה מלאה מצאה האטה בזמן תגובה תפיסתי, במיוחד במשימות חזותיות ואודיו־חזותיות.',{evidence:'מטא־אנליזה',source:'Yang et al., 2026 • Acta Psychologica • PMID 41850080',limit:'האוכלוסיות במחקרים אינן רק בני נוער, ולכן זו תמיכה במנגנון כללי — לא הוכחה ייחודית לתלמידי חטיבה.'}),
I('critical','perception_reaction','האם חוסר שינה גורם לכדור להיראות גדול יותר?','לא זו הטענה.',{reveal:'הדגמת הכדור ממחישה כמה עיבוד נדרש לפני תגובה. היא לא מוכיחה שחוסר שינה משנה את הגודל הנתפס של הכדור.'}),
I('scenario','cognitive_load','זכור 17, חשב 17+8, ובמקביל תפוס כדור','השרירים לא הפכו לחלשים יותר — הוספנו למוח עוד משימה.',{reveal:'זו הדגמה לעומס קוגניטיבי. היא אינה סימולציה מדויקת של חוסר שינה.'}),
I('critical','cognitive_load','עומס קוגניטיבי ≠ מניעת שינה','שתי התופעות יכולות להשפיע על ביצוע, אבל הן לא אותו מנגנון ולא אותה בדיקה.'),
I('study','sport_performance','שינה וביצוע ספורטיבי','סקירה ומטא־אנליזה מ-2024 מצאה שחוסר שינה יכול לפגוע בביצועים ספורטיביים, אך גודל ההשפעה משתנה לפי סוג החסר והמשימה.',{evidence:'מטא־אנליזה',source:'Gong et al., 2024 • Nature and Science of Sleep • PMID 39006249',limit:'“ביצועים” הם הרבה דברים שונים; אין אפקט אחיד וזהה לכל ענף ולכל אדם.'}),
I('question','sport_performance','שחקן יכול להיות חזק ומהיר ועדיין להגיב פחות טוב?','',{choices:['כן','לא'],correct:0,explain:'כן. אם קשב, תפיסה, החלטה או תזמון נפגעים, ביצוע יכול להשתנות גם בלי שינוי בכוח השריר.'}),
I('fact','screens_sleep','מסכים לא משפיעים רק בגלל “אור כחול”','יש לפחות שלושה מסלולים מרכזיים: דחיית שעת השינה, חשיפה לאור בערב, ותוכן שמעורר או מעסיק.'),
I('study','screens_sleep','מדיה דיגיטלית סמוך לשינה','AAP מקשר שימוש במדיה דיגיטלית סמוך לשינה עם שעת שינה מאוחרת יותר, פחות שינה ואיכות שינה פחות טובה.',{evidence:'נייר עמדה מקצועי',source:'AAP, 2026 • Digital Ecosystems policy + technical report',limit:'“מסך” הוא קטגוריה רחבה. סוג התוכן, משך השימוש, שעה ועוצמת האור יכולים להיות שונים מאוד.'}),
I('myth','screens_sleep','מיתוס: “רק האור הכחול הוא הבעיה”','לא מדויק. גם הזמן שהמסך לוקח, ההתעכבות לפני השינה והתוכן עצמו יכולים להשפיע.'),
I('question','screens_sleep','מה יכול להפריע לשינה במסך?','',{choices:['רק הצבע הכחול','רק משחקים','זמן + אור + תוכן','שום דבר'],correct:2,explain:'ההשפעה יכולה להגיע מכמה מנגנונים במקביל.'}),
I('fact','circadian_light','אור הוא אות חשוב לשעון הביולוגי','בבוקר אור עוזר לסמן ערות. לקראת השינה, הפחתת אור יכולה לעזור להכנה הביולוגית לשינה.'),
I('action','sleep_routine','מסלול נחיתה של 30–60 דקות','מקלחת, קריאה, שיחה רגועה, הכנת תיק, מוזיקה רגועה, אור חלש או מתיחות קלות — הרעיון הוא מעבר הדרגתי מפעילות לשינה.'),
I('action','sleep_routine','משפט לזכור','אנחנו לא “מכבים” את המוח. אנחנו נותנים לו מסלול נחיתה.'),
I('study','screens_sleep','מה ממליץ ה-AAP לקראת השינה?','להימנע ככל האפשר ממסכים בשעה שלפני השינה ולהשאיר מכשירים מחוץ לחדר השינה.',{evidence:'המלצה מקצועית',source:'AAP, 2026',limit:'זו המלצה כללית לבריאות שינה; המשפחה והילד יכולים לבנות שגרה שמתאימה למציאות שלהם.'}),
I('question','sleep_routine','מה עדיף ב-30 הדקות האחרונות לפני השינה?','',{choices:['ויכוח בקבוצת וואטסאפ','משחק תחרותי','שגרה רגועה וחוזרת','להדליק את כל האורות'],correct:2,explain:'המטרה היא להפחית עוררות ולבנות מעבר עקבי לשינה.'}),
I('fact','sleep_eating','שינה ואכילה קשורות — אבל לא בצורה פשוטה','הגבלת שינה יכולה להשפיע על התנהגות אכילה, בחירות מזון ותיאבון, אבל לא כל אדם מגיב באותה צורה.'),
I('study','sleep_eating','שינה מוגבלת ובחירות מזון בבני נוער','במחקר בבני 14–16, הגבלת שינה נקשרה לצריכה גבוהה יותר של מזונות בעלי אינדקס גליקמי גבוה וממתקים.',{evidence:'מחקר בבני נוער',source:'Beebe et al., 2013 • Sleep • PMID 23729925',limit:'ממצא על דפוסי אכילה לא אומר שכל תלמיד יהיה רעב יותר באותה מידה.'}),
I('study','sleep_eating','עוד מחקר: קלוריות וקינוחים','במחקר נוסף בבני 14–17, שינה מוגבלת נקשרה ליותר קלוריות וליותר קינוחים ומזונות מתוקים.',{evidence:'מחקר בבני נוער',source:'Beebe et al., 2015 • PLoS ONE • PMID 25706861',limit:'התנהגות אכילה מושפעת גם מסביבה, זמינות מזון, הרגלים וגורמים אישיים.'}),
I('study','sleep_eating','2026: התמונה אפילו מורכבת יותר','ניסוי אקראי מ-2026 מצא הבדלים בין המינים ואף ירידה בצריכה בארוחה הראשונה אחרי לילה מוגבל אצל חלק מהמשתתפים.',{evidence:'ניסוי אקראי',source:'Stager et al., 2026 • Clinical Nutrition • PMID 41825204',limit:'לכן לא נכון ללמד כלל מוחלט של “פחות שינה = תמיד יותר רעב”.'}),

I('critical','evidence','מי אמר את זה — ועל סמך מה?','לא מספיק לשאול “מי אמר?”. כדאי לשאול גם: האם זו הנחיה מקצועית, מטא־אנליזה, ניסוי מבוקר, מחקר תצפיתי או סיפור אישי?'),

I('critical','evidence','מד ראיות: ניסוי מבוקר','ניסוי יכול לבדוק סיבה ותוצאה בצורה חזקה יותר ממחקר תצפיתי, אך לעיתים הוא מתרחש בתנאים קיצוניים או מלאכותיים.'),
I('critical','evidence','מד ראיות: מחקר תצפיתי','מחקר תצפיתי יכול לזהות קשרים בעולם האמיתי, אבל קשר אינו בהכרח הוכחה לסיבה.'),

I('summary','core','מיקרו־סיכום #2','1. הדגמה עוזרת להבין אך לא מוכיחה מנגנון. 2. מסכים יכולים להשפיע דרך זמן, אור ותוכן. 3. שינה ואכילה קשורות, אך לא באותה צורה אצל כולם.'),
I('question','sleep_quantity_quality','מה חשוב יותר: כמות או איכות?','',{choices:['רק כמות','רק איכות','צריך את שתיהן'],correct:2,explain:'שינה בריאה משלבת משך מספיק עם איכות, תזמון וסדירות סבירים.'}),

I('scenario','recovery','תרחיש: כל השבוע 5 שעות, בסוף שבוע 12','האם אפשר להבטיח שכל ההשפעות התאפסו?',{reveal:'לא. שינה משלימה יכולה לעזור, אבל אי אפשר להניח שכל מדד חוזר מיד לבסיס.'}),
I('question','perception_reaction','מה מגיע אחרי “עיבוד”?','',{choices:['תגובה','החלטה','עין','שינה'],correct:1,explain:'במודל שלנו: עין → תפיסה → עיבוד → החלטה → תגובה.'}),
I('question','screens_sleep','איזה מהבאים הוא דוגמה ל“זמן displacement”?','',{choices:['המסך משנה צבע','נשארים לראות סרטון עוד 40 דקות במקום ללכת לישון','החדר חשוך','קוראים ספר'],correct:1,explain:'הזמן שהמסך תופס יכול פשוט לדחות את שעת השינה.'}),
I('action','sleep_routine','הפקדה אחת להלילה','בחר פעולה אחת בלבד: להיכנס למיטה מוקדם יותר, להפסיק מסך מוקדם יותר, להחשיך את החדר, להשאיר את הטלפון מחוץ למיטה או לבנות שגרת נחיתה.'),
I('action','sleep_routine','אל תנסה לשנות הכול בבת אחת','הרגל קטן שחוזר כל ערב יכול להיות שימושי יותר מהחלטה גדולה שמחזיקה יום אחד.'),
I('critical','screens_sleep','כל מסך זה אותו דבר?','לא. צפייה רגועה קצרה אינה בהכרח זהה למשחק תחרותי, ויכוח, הודעות מתמשכות או גלילה של שעה.'),
I('critical','sport_performance','האם פגיעה בזמן תגובה = תמיד הפסד במשחק?','לא. מחקר על מרכיב ביצוע אינו תחזית ודאית לתוצאה של משחק שלם.'),
I('fact','regularity','גם סדירות חשובה','שעות שינה ויקיצה יחסית עקביות יכולות לעזור לגוף להתכונן לשינה ולערות בצורה יציבה יותר.'),
I('question','regularity','מה עדיף בדרך כלל?','',{choices:['שעות שונות לגמרי בכל יום','שגרה יחסית קבועה','לישון רק כשעייפים מאוד'],correct:1,explain:'סדירות היא חלק מאיכות שגרת השינה.'}),
I('critical','sleep_duration','8–10 שעות זה “חוק טבע”?','לא. זה טווח המלצה לאוכלוסייה בגיל 13–18, לא מספר מדויק שחייב להתאים לכל אדם בכל יום.'),
I('scenario','sport_performance','שחקן רואה את הכדור בזמן אבל מחליט מאוחר','איזה חלק בשרשרת כנראה התעכב?',{reveal:'ייתכן שהעיכוב היה בעיבוד או בקבלת ההחלטה — לא בהכרח בראייה עצמה.'}),
I('question','critical_thinking','איזה משפט עדיף בשיעור?','',{choices:['מחקר הוכיח אחת ולתמיד','המחקר מצא בתנאים שנבדקו','כולם מגיבים אותו דבר'],correct:1,explain:'ניסוח מדעי טוב מציין מה נמצא ובאילו תנאים, ולא מגדיל את המסקנה מעבר לנתונים.'}),
I('summary','core','ארבעת המשפטים של השיעור','לילה אחד גרוע הוא אירוע — כמה לילות גרועים יכולים להפוך לדפוס. כמות ≠ איכות. העין קולטת → המוח מפרש → הגוף מגיב. הגוף מקבל את המיקס של ההרגלים לאורך זמן.'),
I('action','core','שאלת יציאה','איזו “הפקדה” אחת אתה מוכן לעשות הלילה?',{reveal:'לא צריך לבחור את הפעולה המושלמת. בחר פעולה קטנה וריאלית שאפשר לבצע כבר הערב.'})
];
let filter='all', rendered=0, order=[], stats=JSON.parse(localStorage.getItem('sleepFeedStats')||'{}');
const feed=document.getElementById('feed'), loader=document.getElementById('loader'), seen=document.getElementById('seen');
function score(it){return (stats[it.concept]?.dont||0)*3-(stats[it.concept]?.know||0)}
function reshuffle(){order=items.map((_,i)=>i).sort((a,b)=>(score(items[b])-score(items[a]))+(Math.random()-.5)*2)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(it,idx){let body=`<div class="meta"><span class="kind">${label(it.type)}</span><span class="evidence">${esc(it.evidence||conceptName(it.concept))}</span></div><div class="title">${esc(it.title)}</div>`;if(it.text)body+=`<div class="text"><p>${esc(it.text)}</p></div>`;if(it.flow)body+=`<div class="flow">${it.flow.map(x=>`<span class="step">${esc(x)}</span>`).join('')}</div>`;if(it.plus)body+=`<div class="deposit"><div class="box plus"><b>＋ הפקדות</b><p>${it.plus.map(esc).join(' • ')}</p></div><div class="box minus"><b>− משיכות</b><p>${it.minus.map(esc).join(' • ')}</p></div></div>`;if(it.choices)body+=`<div>${it.choices.map((x,i)=>`<button class="choice" onclick="answer(event,this,${i===it.correct},'${esc((it.explain||'').replace(/'/g,'&#39;'))}')">${esc(x)}</button>`).join('')}</div>`;if(it.reveal)body+=`<button class="btn save" onclick="toggleReveal(event,this)">חשוף תשובה</button><div class="reveal">${esc(it.reveal)}</div>`;if(it.source)body+=`<div class="source"><b>מקור:</b> ${esc(it.source)}</div>`;if(it.limit)body+=`<div class="limit"><b>מה לא להסיק:</b> ${esc(it.limit)}</div>`;body+=`<div class="btnrow"><button class="btn know" onclick="rate(event,'${esc(it.concept)}','know')">✓ ידעתי</button><button class="btn dont" onclick="rate(event,'${esc(it.concept)}','dont')">✕ לא ידעתי</button><button class="btn save" onclick="saveCard(event,${idx})">🔖 שמור</button></div>`;return `<article class="card ${it.type}" data-type="${it.type}">${body}</article>`}
function label(t){return ({study:'🔬 מחקר בדקה',question:'❓ בדוק את עצמך',critical:'🧠 חשיבה ביקורתית',myth:'🧯 מיתוס או דיוק',scenario:'🎬 תרחיש',balance:'⚖️ העובר ושב',action:'🌙 ליישום',summary:'🧩 סיכום קצר',fact:'💡 נקודת ידע'}[t]||'📘 למידה')}
function conceptName(c){return ({sleep_quantity_quality:'כמות ואיכות',sleep_duration:'משך שינה',sleep_function:'תפקידי השינה',sport_recovery:'התאוששות',sleep_deprivation:'מניעת שינה',sleep_debt:'הצטברות',recovery:'התאוששות',sleep_pressure:'לחץ שינה',adenosine:'אדנוזין',balance_model:'העובר ושב',perception_reaction:'תפיסה ותגובה',cognitive_load:'עומס קוגניטיבי',sport_performance:'ספורט',screens_sleep:'מסכים ושינה',circadian_light:'אור ושעון ביולוגי',sleep_routine:'שגרת ערב',sleep_eating:'שינה ואכילה',sleep_health:'תפקוד',evidence:'ראיות',regularity:'סדירות',critical_thinking:'חשיבה מדעית',core:'עיקרי השיעור'}[c]||c)}
function filtered(){return order.map(i=>({i,it:items[i]})).filter(x=>filter==='all'||(filter==='study'?x.it.type==='study':filter==='question'?['question','scenario','myth'].includes(x.it.type):x.it.type===filter))}
function loadMore(){const arr=filtered();if(!arr.length)return;for(let n=0;n<8;n++){const x=arr[(rendered+n)%arr.length];feed.insertAdjacentHTML('beforeend',card(x.it,x.i))}rendered+=8;seen.textContent=rendered;if(rendered%arr.length<8)reshuffle()}
function answer(e,b,ok,exp){e.stopPropagation();b.classList.add(ok?'good':'bad');if(!b.parentNode.querySelector('.feedback')){const d=document.createElement('div');d.className='reveal feedback';d.style.display='block';d.textContent=(ok?'✓ נכון. ':'✕ לא בדיוק. ')+exp;b.parentNode.appendChild(d)}}
function toggleReveal(e,b){e.stopPropagation();b.closest('.card').classList.toggle('open');b.textContent=b.closest('.card').classList.contains('open')?'הסתר תשובה':'חשוף תשובה'}
function rate(e,c,k){e.stopPropagation();stats[c]=stats[c]||{know:0,dont:0};stats[c][k]++;localStorage.setItem('sleepFeedStats',JSON.stringify(stats));e.target.textContent=k==='know'?'✓ נשמר':'✕ נחזור על זה';reshuffle()}
function saveCard(e,i){e.stopPropagation();const saved=JSON.parse(localStorage.getItem('sleepSaved')||'[]');if(!saved.includes(i))saved.push(i);localStorage.setItem('sleepSaved',JSON.stringify(saved));e.target.textContent='🔖 נשמר'}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;feed.innerHTML='';rendered=0;reshuffle();loadMore()});
reshuffle();loadMore();const io=new IntersectionObserver(es=>{if(es[0].isIntersecting)loadMore()},{rootMargin:'500px'});io.observe(loader);
</script></body></html>
