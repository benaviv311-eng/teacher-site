umns:1fr}.hero{padding:22px}.title{font-size:19px}}</style></head><body><a class="home-fixed" href="index.html" aria-label="בית">🏠</a><main class="wrap"><div class="top"><a class="back" href="lessons.html" aria-label="חזרה לשיעורים">חזרה לשיעורים</a><b>☀️ בית ספר אור</b></div><section class="hero"><small>אורח חיים בריא • שיעור 1 • אב־טיפוס לפיד הלמידה</small><h1>שינה: הבסיס לתפקוד היומיומי</h1><p>לא רק לקרוא חומר — להבין, לבדוק, לטעות, לחזור ולראות את אותו רעיון מזוויות שונות. הפיד משלב חומר מהשיעור, מחקרים, ביסוסים, תרחישים ושאלות קצרות.</p></section><div class="chips"><button class="chip active" data-filter="all">הכול</button><button class="chip" data-filter="study">🔬 מחקרים</button><button class="chip" data-filter="question">❓ שאלות</button><button class="chip" data-filter="critical">🧠 חשיבה ביקורתית</button><button class="chip" data-filter="action">🌙 ליישום</button></div><section id="feed" class="feed"></section><div id="loader" class="loader">ממשיך להכין לך חומר…</div></main><div class="sticky-stat">נלמדו <b id="seen">0</b> כרטיסים</div><script>
const I=(type,concept,title,text,extra={})=>({type,concept,title,text,...extra});
const items=[
I('fact','sleep_quantity_quality','כמות שינה ואיכות שינה הן לא אותו דבר','כמות היא כמה זמן ישנת בפועל. איכות מתייחסת בין היתר לרציפות, לתזמון ולהרגשה שהשינה הייתה משקמת.'),
I('question','sleep_quantity_quality','9 שעות במיטה = 9 שעות שינה?','', {choices:['כן, תמיד','לא בהכרח'],correct:1,explain:'זמן במיטה אינו זהה בהכרח לזמן שינה בפועל.'}),
I('study','sleep_duration','כמה שעות שינה צריך בגיל ההתבגרות?','לפי המלצת AASM, בגיל 13–18 ההמלצה היא בדרך כלל 8–10 שעות שינה ביממה באופן קבוע.',{evidence:'הנחיה מקצועית',source:'Paruthi et al., 2016 • AASM • PMID 27250809',limit:'זו המלצה לטווח אוכלוסייה, לא מספר קסם שמתאים בדיוק לכל אדם בכל לילה.'}),
I('study','sleep_duration','ומה לגבי גיל 12?','לילדים בגיל 6–12 ההמלצה היא 9–12 שעות ביממה. לכן תלמיד בן 12 נמצא בטווח שונה מתלמיד בן 13.',{evidence:'הנחיה מקצועית',source:'AASM, 2016',limit:'גיל הוא רק חלק מהתמונה; גם איכות, תזמון וסדירות חשובים.'}),
I('fact','sleep_function','השינה היא לא “כיבוי”','בזמן שינה הגוף והמוח ממשיכים בתהליכים הקשורים ללמידה וזיכרון, ויסות רגשי, גדילה, בריאות והתאוששות.'),
I('question','sleep_function','מה המשפט המדויק יותר?','',{choices:['בשינה הגוף כבוי','בשינה הגוף עובד אחרת','שריר נבנה רק בזמן שינה'],correct:1,explain:'שינה היא מצב פעיל מבחינה ביולוגית. לא נכון לומר שהגוף פשוט “כבוי”, וגם לא ששריר נבנה רק בזמן השינה.'}),
I('fact','sport_recovery','אימון הוא רק חלק מהתהליך','האימון הוא גירוי. תזונה, שינה ומנוחה הן חלק מתהליך ההתאוששות וההסתגלות.'),
I('myth','sport_recovery','מיתוס: “אם התאמנתי טוב, השינה פחות חשובה”','אימון טוב לא מבטל חוסר שינה. במודל העובר ושב, פעולה טובה בתחום אחד לא פוטרת פעולה מזיקה בתחום אחר.'),
I('study','sleep_deprivation','מה קורה אחרי לילה שלם בלי שינה?','במחקר בקרב בני 14–18, לילה שלם ללא שינה פגע בקשב מתמשך, במהירות תגובה ובמהירות עיבוד, והעלה ישנוניות.',{evidence:'מחקר ניסויי',source:'Louca & Short, 2014 • Sleep • PMID 25364075',limit:'המחקר בדק לילה שלם ללא שינה. אסור להסיק ממנו ששעה אחת פחות גורמת בדיוק לאותו אפקט.'}),
I('critical','sleep_deprivation','מצא את ההגזמה','“מחקר הוכיח שכל תלמיד שישן שעה פחות יגיב לאט באותה מידה.”',{reveal:'זו הגזמה. המחקר בדק מניעת שינה מלאה, והתגובה לחוסר שינה משתנה לפי כמות החסר, מספר הלילות, האדם והמשימה.'}),
I('question','sleep_deprivation','לילה אחד גרוע ודפוס של שבוע — זה אותו דבר?','',{choices:['כן','לא'],correct:1,explain:'לילה בודד הוא אירוע; כשחוסר השינה חוזר שוב ושוב הוא עלול ליצור הצטברות של פגיעה בתפקוד.'}),
I('study','sleep_debt','7 לילות של שינה מוגבלת','במחקר בבני 15–19, 5 שעות זמן במיטה במשך 7 לילות הובילו לירידה מצטברת בקשב, בזיכרון עבודה, בתפקודים ניהוליים ובמצב רוח.',{evidence:'מחקר ניסויי',source:'Lo et al., 2016 • Sleep • PMID 26612392',limit:'5 שעות זמן במיטה הוא מצב משמעותי של הגבלת שינה; אין להסיק שכל חסר קטן ייצור אותה עוצמת פגיעה.'}),
I('study','recovery','שני לילות התאוששות לא תמיד מחזירים הכול מיד','באותו קו מחקרי, אחרי תקופה של שינה מוגבלת, חלק מהמדדים לא חזרו מיד לקו הבסיס אחרי שני לילות התאוששות.',{evidence:'מחקר ניסויי',source:'Lo et al., 2016/2017',limit:'זה לא אומר שסוף שבוע של שינה אינו מועיל; המשמעות היא שלא נכון להניח שהוא מוחק תמיד את כל ההצטברות.'}),
I('critical','recovery','“אני אשלים הכול בשבת” — מה הבעיה במשפט?','השלמת שינה יכולה לעזור, אבל אין הבטחה שכל מדד תפקודי יחזור מיד לרמה ההתחלתית.',{reveal:'הניסוח המדויק יותר: התאוששות אפשרית ולעיתים משמעותית, אבל לא כדאי לבנות על תיקון מלא ומיידי של דפוס חוזר.'}),
I('fact','sleep_pressure','ככל שאנחנו ערים יותר — לחץ השינה גדל','אחד המנגנונים המעורבים בוויסות שינה הוא לחץ שינה הומאוסטטי: הצורך לישון נוטה לעלות ככל שמשך הערות מתארך.'),
I('fact','adenosine','אדנוזין הוא חלק מהסיפור','במהלך ערות רמות אדנוזין במוח נוטות לעלות ובמהלך שינה הן יורדות. זה אחד המנגנונים הקשורים לתחושת לחץ השינה.'),
I('critical','sleep_pressure','החרוזים בכיתה הם לא אדנוזין','המיכל והחרוזים הם המחשה של הצטברות לחץ שינה. אין באמת מיכל חרוזים במוח.',{reveal:'הדגמה טובה הופכת רעיון למוחשי. היא לא הופכת למודל ביולוגי מדויק רק כי קל לזכור אותה.'}),
I('question','sleep_pressure','בלילה קצר הוצאנו רק חלק מהחרוזים. מה זה מייצג?','',{choices:['מדידה מדויקת של אדנוזין','רעיון של התאוששות חלקית ולחץ שינה שנותר','פסולת מוחית אמיתית'],correct:1,explain:'החרוזים הם המחשה בלבד של הרעיון, לא חומר אמיתי ולא מדד פיזיולוגי.'}),
I('fact','balance_model','העובר ושב: הפקדות ומשיכות','זהו מודל חשיבה על הצטברות הרגלים לאורך זמן. פעולה אחת אינה קובעת לבדה את התוצאה.'),
I('question','balance_model','אימון מצוין + 4 שעות שינה. האימון “מבטל” את השינה?','',{choices:['כן','לא'],correct:1,explain:'תחום אחד לא מבטל אוטומטית תחום אחר. אפשר לעשות הפקדה אחת ומשיכה אחרת באותו יום.'}),
I('critical','balance_model','זה לא חשבון בנק אמיתי','אי אפשר לומר שאימון שווה בדיוק +10 ושינה קצרה שווה -8. העובר ושב הוא דרך לחשוב על דפוס, לא נוסחה.'),
I('action','balance_model','בחר הפקדה אחת להלילה','אפשר לבחור שעת שינה מעט מוקדמת יותר, להוציא את הטלפון מהמיטה, להחשיך את החדר או ליצור שגרת נחיתה.'),
I('fact','perception_reaction','לפני שהיד זזה — המוח כבר עבד','העין קולטת מידע, המוח מפרש אותו, מעריך כיוון ומהירות, מחליט מה לעשות ורק אז שולח פקודה לתנועה.'),
I('sequence','perception_reaction','סדר את השרשרת בראש','',{steps:['עין קולטת','תפיסה','עיבוד','החלטה','תגובה']}),
I('study','perception_reaction','חוסר שינה וזמן תגובה תפיסתי','מטא־אנליזה מ־2026 מצאה שמניעת שינה מלאה מאטה זמן תגובה תפיסתי, כולל במשימות חזותיות ואודיו־חזותיות.',{evidence:'מטא־אנליזה',source:'Yang et al., 2026 • Acta Psychologica • PMID 41850080',limit:'הסקירה אינה מחקר ייעודי רק לבני נוער. היא תומכת במנגנון כללי ואינה מחליפה ראיות ספציפיות למתבגרים.'}),
I('critical','perception_reaction','האם חוסר שינה גורם לכדור להיראות גדול יותר?','לא הראינו את זה ולא נכון ללמד כך.',{reveal:'הדגמת הכדורים מדגימה כמה מידע המוח צריך לעבד — גודל, מרחק, כיוון, מסלול, מהירות ותזמון. היא לא מוכיחה שחוסר שינה משנה את הגודל הנתפס.'}),
I('scenario','perception_reaction','שחקנית חזקה ומהירה — אבל קולטת את הכדור מאוחר','גם אם הכוח בשריר לא השתנה, עיכוב בקשב, בתפיסה, בהחלטה או בתזמון יכול לשנות את הביצוע.'),
I('fact','cognitive_load','זוכרים 17, מחשבים 17+8 ותופסים כדור','כשהוספנו משימה מחשבתית בזמן תפיסת הכדור, העמסנו עוד דרישה על מערכת עיבוד המידע.'),
I('critical','cognitive_load','האם זה סימולציה מדויקת של חוסר שינה?','לא.',{reveal:'התרגיל מדגים עומס על עיבוד וקשב. הוא אינו מחקה מבחינה פיזיולוגית מניעת שינה.'}),
I('study','sports_performance','ומה לגבי ביצועים ספורטיביים?','סקירה ומטא־אנליזה מ־2024 מצאה שחוסר שינה יכול לפגוע במדדים שונים של ביצועים ספורטיביים.',{evidence:'מטא־אנליזה',source:'Gong et al., 2024 • Nature and Science of Sleep • PMID 39006249',limit:'גודל ההשפעה אינו אחיד — הוא משתנה לפי סוג הפעילות, אופן מניעת השינה והאוכלוסייה.'}),
I('question','sports_performance','ביצוע ספורטיבי הוא רק כוח שריר?','',{choices:['כן','לא'],correct:1,explain:'ביצוע כולל גם קשב, תפיסה, החלטה, תזמון, קואורדינציה והתאוששות.'}),
I('myth','screens_sleep','מיתוס: “הטלפון מפריע רק בגלל האור הכחול”','מסך יכול להשפיע גם כי הוא דוחה את שעת השינה, בגלל האור עצמו, ובגלל תוכן מעורר או אינטראקציה חברתית.'),
I('study','screens_sleep','מדיה דיגיטלית לפני השינה','AAP מתאר קשר בין שימוש במדיה סמוך לשינה לבין שעת שינה מאוחרת יותר, פחות שינה ואיכות שינה ירודה יותר.',{evidence:'הנחיה וסקירת ראיות',source:'American Academy of Pediatrics, 2026 • Pediatrics',limit:'לא כל מסך, תוכן או תלמיד מושפעים באותה מידה. צריך להימנע מהסבר של מנגנון יחיד.'}),
I('fact','circadian_light','אור הוא אות חשוב לשעון הביולוגי','אור, במיוחד בערב, יכול להשפיע על ההכנה הביולוגית לשינה. לכן הגיוני להגביר אור בבוקר ולהפחית אור לקראת השינה.'),
I('action','screens_sleep','מסלול נחיתה של 30–60 דקות','מקלחת, קריאה, שיחה רגועה, הכנת התיק, מוזיקה שקטה, אור חלש או מתיחות קלות — במקום לעבור ישר מעוררות גבוהה למיטה.'),
I('fact','screens_sleep','אנחנו לא “מכבים את המוח”','המטרה בשגרת ערב אינה לכבות את המוח בכפתור, אלא לתת לו מעבר הדרגתי למצב שמתאים יותר לשינה.'),
I('question','screens_sleep','מה יכול להפריע בשעת מסך מאוחרת?','',{choices:['רק אור כחול','רק הזמן שמתבזבז','זמן, אור ותוכן יכולים כולם להיות חלק מהעניין'],correct:2,explain:'ההשפעה האפשרית אינה מסתכמת בגורם אחד.'}),
I('fact','sleep_eating','שינה ואכילה: הקשר קיים, אבל לא פשוט','מחקרים במתבגרים מצאו ששינה מוגבלת יכולה להשפיע על צריכת מזון ועל בחירת מזונות, אך התגובה אינה אחידה.'),

I('summary','summary','סיום שהוא גם התחלה','אם אתה זוכר רק דבר אחד: שינה אינה “הפסקה” מהביצועים. היא חלק מהמערכת שמאפשרת ללמוד, לשים לב, להחליט, להגיב ולהתאושש.')
];
const label={fact:'נקודת ידע',question:'בדוק את עצמך',study:'מחקר בדקה',myth:'מיתוס או דיוק?',critical:'חשיבה ביקורתית',action:'ליישום',sequence:'סדר פעולות',scenario:'תרחיש',summary:'סיכום ביניים'};
let order=[],cursor=0,filter='all',seen=0;const mastery=JSON.parse(localStorage.getItem('sleepMastery')||'{}');const saved=JSON.parse(localStorage.getItem('sleepSaved')||'[]');
function shuffle(){const idx=items.map((_,i)=>i);idx.sort((a,b)=>((mastery[items[a].concept]||0)-(mastery[items[b].concept]||0))+(Math.random()-.5)*3);order=idx}
function visible(){return order.filter(i=>filter==='all'||items[i].type===filter)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(it,i){let body=`<div class="meta"><span class="kind">${label[it.type]||'למידה'}</span>${it.evidence?`<span class="evidence">${esc(it.evidence)}</span>`:''}</div><div class="title">${esc(it.title)}</div>${it.text?`<p class="text">${esc(it.text)}</p>`:''}`;if(it.choices)body+=`<div>${it.choices.map((c,j)=>`<button class="choice" onclick="choose(this,${j},${it.correct})">${esc(c)}</button>`).join('')}<div class="reveal">${esc(it.explain)}</div></div>`;if(it.reveal)body+=`<button class="btn save" onclick="this.closest('.card').classList.toggle('open')">חשוף את הדיוק</button><div class="reveal">${esc(it.reveal)}</div>`;if(it.steps)body+=`<div class="flow">${it.steps.map(x=>`<span class="step">${esc(x)}</span>`).join('<span>←</span>')}</div>`;if(it.source)body+=`<div class="source"><b>מקור:</b> ${esc(it.source)}</div>`;if(it.limit)body+=`<div class="limit"><b>מה לא להסיק:</b> ${esc(it.limit)}</div>`;body+=`<div class="btnrow"><button class="btn know" onclick="rate('${it.concept}',1)">✓ ידעתי</button><button class="btn dont" onclick="rate('${it.concept}',-1)">✕ לא ידעתי</button><button class="btn save" onclick="saveItem(${i},this)">${saved.includes(i)?'🔖 נשמר':'🔖 שמור'}</button></div>`;return `<article class="card ${it.type}">${body}</article>`}
function loadMore(){const v=visible();if(!v.length)return;for(let n=0;n<9;n++){const i=v[(cursor+n)%v.length];document.getElementById('feed').insertAdjacentHTML('beforeend',render(items[i],i));seen++}cursor+=9}
function choose(btn,j,c){const box=btn.parentElement;box.querySelectorAll('.choice').forEach((b,k)=>b.classList.add(k===c?'good':k===j?'bad':''));box.parentElement.classList.add('open')}
function rate(c,d){mastery[c]=(mastery[c]||0)+d;localStorage.setItem('sleepMastery',JSON.stringify(mastery))}
function saveItem(i,b){const p=saved.indexOf(i);if(p<0){saved.push(i);b.textContent='🔖 נשמר'}else{saved.splice(p,1);b.textContent='🔖 שמור'}localStorage.setItem('sleepSaved',JSON.stringify(saved))}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;cursor=0;document.getElementById('feed').innerHTML='';loadMore()});shuffle();loadMore();new IntersectionObserver(e=>{if(e[0].isIntersecting)loadMore()},{rootMargin:'500px'}).observe(document.getElementById('loader'));
</script></body></html>
